<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventário de TI HORIZONTE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#1b2333;--mu:#667085;--bd:#e3e8f0;--pr:#4f46e5;--pt:#fff;--ok:#12805c;--wa:#b7791f;--er:#c0392b;--sh:0 1px 3px rgba(20,30,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--sf:#181f2e;--tx:#e8ecf5;--mu:#98a2b8;--bd:#2a3347;--pr:#818cf8;--pt:#10142a;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--sf:#181f2e;--tx:#e8ecf5;--mu:#98a2b8;--bd:#2a3347;--pr:#818cf8;--pt:#10142a;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
.app{display:flex;min-height:100vh}
nav{width:220px;background:var(--sf);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;flex-shrink:0}
nav h1{font-size:17px;margin:4px 10px 16px}nav h1 span{color:var(--pr)}
nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--mu);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}
nav button.on{background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr);font-weight:600}
main{flex:1;min-width:0;padding:20px;max-width:1100px;margin:0 auto;width:100%}
h2{margin:0 0 14px;font-size:22px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi b{display:block;font-size:28px}.kpi span{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:none;color:var(--pr);border:1px solid var(--bd)}.btn.d{background:var(--er);color:#fff}.btn.s{padding:6px 10px;font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--bd)}
.t-Em-uso{color:var(--ok)}.t-Manutenção{color:var(--wa)}.t-Baixado{color:var(--er)}.t-Disponível{color:var(--pr)}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal>div{background:var(--sf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
@media(min-width:700px){.modal{align-items:center;padding:20px}.modal>div{border-radius:18px}}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.qr svg,.qr img{width:130px;height:130px;background:#fff;padding:6px;border-radius:8px}
.mu{color:var(--mu)}.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:14px}.tl div{margin-bottom:10px;position:relative}.tl div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pr)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;display:none}
@media(max-width:760px){.app{display:block}nav{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--bd);z-index:20}
nav h1{display:none}nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;justify-content:center;align-items:center;text-align:center}main{padding:14px 14px 90px}}
.doc{background:#fff;color:#000;padding:22px;font:13px/1.5 Georgia,serif;border-radius:8px}.doc h3{text-align:center;margin:0 0 4px}.doc p{margin:6px 0;text-align:justify}.doc table{width:100%;border-collapse:collapse}.doc th,.doc td{border:1px solid #999;padding:4px;white-space:normal;color:#000}
@media print{body *{visibility:hidden}.lab,.lab *,.doc,.doc *{visibility:visible}.lab,.doc{position:absolute;left:0;top:0;width:100%}.np{display:none!important}.modal,.modal>div{position:static;overflow:visible;max-height:none}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="m"></main></div><div id="toast"></div><div id="md"></div>
<script>
const CATS={NB:"Notebook",DT:"Desktop",MON:"Monitor",CEL:"Celular",IMP:"Impressora",MOU:"Mouse",TEC:"Teclado",OUT:"Outros"};
const ST=["Disponível","Em uso","Manutenção","Baixado"];
const TIPOS=["Transferência","Atribuição","Devolução","Envio à manutenção","Retorno da manutenção","Perda/Avaria","Baixa"];
let S={filiais:[],ativos:[],movs:[],supr:[],segredos:[],pessoas:[]},tab="dash",q="",fF="",fS="",docRef=null,me="Usuário local";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)};
const now=()=>new Date().toLocaleString("pt-BR");
// ===== CONFIGURAÇÃO: cole aqui a URL e a chave anon do Supabase =====
const CFG={url:"https://sfejenutgnvdviriysjb.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmZWplbnV0Z252ZHZpcml5c2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDc2OTYsImV4cCI6MjEwODUyMzY5Nn0.-tSNotkaZJqmm050_KS_uYv5qM_k127Ptkj3duDmfz4"};
const EMPRESA="Grupo Horizonte"; // nome que sai nos termos impressos
// ====================================================================
let base="";try{base=new URL(CFG.url.trim()).origin}catch(e){}
const sb=base.startsWith("https")?supabase.createClient(base,CFG.key.trim()):null;
const T={filiais:"ti_filiais",ativos:"ti_ativos",movs:"ti_movs",supr:"ti_supr",pessoas:"ti_ativos",segredos:"ti_ativos"},idOf={filiais:r=>r.id,ativos:r=>r.cod,movs:r=>r.id,supr:r=>r.cod,pessoas:r=>r.id,segredos:r=>"SEG-"+r.cod};
let snap={},chain=Promise.resolve(),rt;
const movId=()=>"MOV-"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
async function load(){
  if(!sb){try{const j=localStorage.getItem("inv");if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}return}
  for(const k in T){const{data,error}=await sb.from(T[k]).select("id,data").order("updated_at",{ascending:k==="movs"?false:true});
    if(error){toast("Erro ao carregar: "+error.message);continue}
    const okr=r=>k==="pessoas"?r.data.v===2:k==="segredos"?r.data.v===3:k==="ativos"?!(r.data.v>=2):true;const L=data.filter(okr);S[k]=L.map(r=>r.data);snap[k]=Object.fromEntries(L.map(r=>[r.id,JSON.stringify(r.data)]))}
}
async function _save(){
  if(!sb){try{localStorage.setItem("inv",JSON.stringify(S))}catch(e){}return true}
  for(const k in T){const old=snap[k]||(snap[k]={});
    for(const r of S[k]){const id=idOf[k](r),js=JSON.stringify(r);if(old[id]===js)continue;
      const res=old[id]===undefined?await sb.from(T[k]).insert({id,data:r}):await sb.from(T[k]).update({data:r,updated_at:new Date().toISOString()}).eq("id",id);
      if(res.error){toast(res.error.code==="23505"?"Código já criado por outro usuário. Atualizando…":"Erro ao salvar no banco: "+res.error.message);await load();render();return false}
      old[id]=js}}
  return true
}
const save=()=>chain=chain.then(_save);
function loginView(){$("#nav").innerHTML="";$("#m").innerHTML=`<div class="card" style="max-width:380px;margin:12vh auto"><h2>🗂️ Inventário TI</h2><div class="f" style="grid-template-columns:1fr"><label>E-mail<input id="le" type="email"></label><label>Senha<input id="lp" type="password" onkeydown="if(event.key==='Enter')login()"></label></div><div class="row" style="margin-top:14px"><button class="btn" onclick="login()">Entrar</button></div></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value});if(error)return toast("Erro: "+error.message);start()}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){
  if(sb){const{data}=await sb.auth.getSession();if(!data.session)return loginView();me=data.session.user.email}
  await load();render();
  if(sb)sb.channel("ti").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rt);rt=setTimeout(async()=>{await chain;await load();if(!$("#md").innerHTML&&!document.activeElement.matches("input,textarea,select"))render()},700)}).subscribe();
  const h=location.hash.slice(1);if(h)ficha(h)
}
const nextCode=cat=>{const p="TI-"+cat+"-";const n=S.ativos.filter(a=>a.cod.startsWith(p)).reduce((m,a)=>Math.max(m,+a.cod.slice(p.length)||0),0)+1;return p+String(n).padStart(6,"0")};
const fil=id=>S.filiais.find(f=>f.id===id)?.nome||id||"—";
const url=c=>location.href.split("#")[0]+"#"+c;
function qrSvg(c){const q=qrcode(0,"M");q.addData(url(c));q.make();return q.createSvgTag({cellSize:4,margin:0})}
function seed(){
  S.filiais=[["FIL-001","Belo Horizonte"],["FIL-002","Contagem"],["FIL-003","São Paulo"]].map(([id,nome])=>({id,nome,locais:["Almoxarifado de TI","Administrativo","Manutenção"]}));
  const mk=[["NB","Dell","Latitude 5440"],["DT","HP","ProDesk 400"],["MON","LG","24MK430"],["CEL","Samsung","Galaxy A54"]];
  mk.forEach(([c,f,m],i)=>{for(let k=0;k<4;k++){S.ativos.push({cod:nextCode(c),cat:c,fab:f,mod:m,serie:"SN"+Math.random().toString(36).slice(2,9).toUpperCase(),fil:S.filiais[(i+k)%3].id,loc:"Administrativo",resp:k%2?"":"colaborador"+(k+1)+"@empresa.com",st:k%2?"Disponível":"Em uso",cond:"Bom",aq:"",gar:"",obs:""})}});
  S.supr=[{cod:"SUP-MOU-001",desc:"Mouse USB com fio",min:20,max:100,saldos:{"FIL-001":45,"FIL-002":12,"FIL-003":30}},{cod:"SUP-TEC-001",desc:"Teclado USB ABNT2",min:10,max:60,saldos:{"FIL-001":8,"FIL-002":20,"FIL-003":15}}];
  save();render();toast("Dados de exemplo carregados")
}
function mov(a,tipo,dest,motivo){
  const m={id:movId(),cod:a.cod,tipo,dt:now(),user:me,de:`${fil(a.fil)} / ${a.loc}`,para:"",resp0:a.resp,resp1:"",motivo};
  if(tipo==="Transferência"){a.fil=dest.fil;a.loc=dest.loc||a.loc}
  if(tipo==="Atribuição"){a.resp=dest.resp;a.st="Em uso";m.resp1=dest.resp}
  if(tipo==="Devolução"){a.resp="";a.st="Disponível"}
  if(tipo==="Envio à manutenção"){a.st="Manutenção"}
  if(tipo==="Retorno da manutenção"){a.st=a.resp?"Em uso":"Disponível"}
  if(tipo==="Perda/Avaria"){a.st="Manutenção";a.cond="Avariado"}
  if(tipo==="Baixa"){a.st="Baixado";a.resp=""}
  m.para=`${fil(a.fil)} / ${a.loc}`;S.movs.unshift(m);save()
}
const tabs=[["dash","📊","Início"],["ativos","💻","Ativos"],["scan","📷","Escanear"],["supr","📦","Suprimentos"],["movs","🔄","Histórico"],["fil","🏢","Filiais"],["pess","👥","Colaboradores"],["qlp","📋","QLP"]];
function render(){
  $("#nav").innerHTML="<h1>🗂️ Inventário <span>TI</span></h1>"+tabs.map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join("")+(sb?'<button onclick="logout()"><span>🚪</span>Sair</button>':"");
  const v={dash,ativos,scan,supr,movs,fil:filiais,pess:pessoas,qlp}[tab];$("#m").innerHTML=(sb?"":`<div class="card" style="border-color:var(--er);color:var(--er)"><b>⚠️ Modo local: banco não conectado.</b> Os dados ficam só neste aparelho e não são compartilhados. Cole a URL e a chave do Supabase no começo do script do index.html.</div>`)+v();if(tab==="scan")startCam()
}
const go=k=>{tab=k;q="";render();scrollTo(0,0)};
function dash(){
  const A=S.ativos,c=s=>A.filter(a=>a.st===s).length,low=S.supr.flatMap(s=>Object.entries(s.saldos).filter(([f,n])=>n<s.min).map(([f,n])=>[s,f,n]));
  const sem=A.filter(a=>!a.serie||!a.resp&&a.st==="Em uso").length;
  const mx=Math.max(1,...S.filiais.map(f=>A.filter(a=>a.fil===f.id).length));
  if(!A.length&&!S.filiais.length)return`<h2>Bem-vindo 👋</h2><div class="card"><p>Comece cadastrando uma filial ou carregue dados de exemplo para conhecer o sistema.</p><button class="btn" onclick="seed()">Carregar dados de exemplo</button> <button class="btn g" onclick="go('fil')">Cadastrar filial</button></div>`;
  return`<h2>Painel geral</h2><div class="grid">
  ${[["Ativos cadastrados",A.length],["Em uso",c("Em uso")],["Disponíveis",c("Disponível")],["Em manutenção",c("Manutenção")],["Itens abaixo do mínimo",low.length],["Dados incompletos",sem]].map(([l,n])=>`<div class="card kpi" style="margin:0"><b>${n}</b><span>${l}</span></div>`).join("")}</div>
  <div class="card"><b>Ativos por filial</b><div style="margin-top:10px;display:grid;gap:10px">${S.filiais.map(f=>{const n=A.filter(a=>a.fil===f.id).length;return`<div><div class="row" style="justify-content:space-between;margin:0"><span>${esc(f.nome)}</span><span class="mu">${n}</span></div><div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`}).join("")||'<span class="mu">Sem filiais</span>'}</div></div>
  <div class="card"><b>⚠️ Estoque abaixo do mínimo</b>${low.map(([s,f,n])=>`<div style="padding:6px 0">${esc(s.desc)} — ${esc(fil(f))}: <b style="color:var(--er)">${n}</b> / mín ${s.min}</div>`).join("")||'<div class="mu">Tudo em ordem.</div>'}</div>
  <div class="card"><b>Últimas movimentações</b>${S.movs.slice(0,5).map(m=>`<div style="padding:6px 0">${m.dt} · <b>${m.cod}</b> · ${m.tipo}</div>`).join("")||'<div class="mu">Nenhuma ainda.</div>'}</div>`
}
function ativos(){
  const L=S.ativos.filter(a=>(!fF||a.fil===fF)&&(!fS||a.st===fS)&&(!q||(a.cod+a.serie+a.mod+a.resp+a.fab+(a.colab||"")).toLowerCase().includes(q.toLowerCase())));
  return`<h2>Ativos de TI</h2><div class="row"><input id="sq" placeholder="Buscar código, série, modelo…" value="${esc(q)}" oninput="q=this.value;keep()" style="flex:1;min-width:160px">
  <select onchange="fF=this.value;render()"><option value="">Todas as filiais</option>${S.filiais.map(f=>`<option value="${f.id}" ${fF===f.id?"selected":""}>${esc(f.nome)}</option>`).join("")}</select>
  <select onchange="fS=this.value;render()"><option value="">Todos status</option>${ST.map(s=>`<option ${fS===s?"selected":""}>${s}</option>`).join("")}</select>
  <button class="btn" onclick="formAtivo()">+ Novo</button><button class="btn g" onclick="exportCsv()">Exportar CSV</button></div>
  <div class="card tw"><table><tr><th>Código</th><th>Categoria</th><th>Modelo</th><th>Série</th><th>Filial</th><th>Responsável</th><th>Status</th></tr>
  ${L.map(a=>`<tr class="c" onclick="ficha('${a.cod}')"><td><b>${a.cod}</b></td><td>${CATS[a.cat]}</td><td>${esc(a.fab+" "+a.mod)}</td><td>${esc(a.serie)||"—"}</td><td>${esc(fil(a.fil))}</td><td>${esc(a.resp)||"—"}</td><td><span class="tag t-${a.st.replace(" ","-")}">${a.st}</span></td></tr>`).join("")||'<tr><td colspan="7" class="mu">Nenhum ativo encontrado.</td></tr>'}</table></div>`
}
function keep(){const p=$("#m"),pos=$("#sq").selectionStart;const h=ativos();p.innerHTML=h;const e=$("#sq");e.focus();e.setSelectionRange(pos,pos)}
function modal(h){$("#md").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`}
const closeM=()=>{$("#md").innerHTML="";if(location.hash)history.replaceState(null,"",location.pathname)};
function formAtivo(){
  if(!S.filiais.length)return toast("Cadastre uma filial primeiro");
  modal(`<h2>Novo ativo</h2><div class="f">
  <label>Categoria<select id="n_cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
  <label>Fabricante<input id="n_fab"></label><label>Modelo<input id="n_mod"></label><label>Nº de série<input id="n_ser"></label>
  <label>Filial<select id="n_fil" onchange="locs()">${S.filiais.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join("")}</select></label>
  <label>Local<select id="n_loc"></select></label><label>Responsável (e-mail)<input id="n_res" type="email"></label>
  <label>Garantia até<input id="n_gar" type="date"></label></div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="saveAtivo()">Salvar e gerar QR</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`);locs()
}
function locs(){const f=S.filiais.find(f=>f.id===$("#n_fil").value);$("#n_loc").innerHTML=(f?.locais||[]).map(l=>`<option>${esc(l)}</option>`).join("")}
function saveAtivo(){
  const g=i=>$("#"+i).value.trim();if(!g("n_fab")||!g("n_mod"))return toast("Informe fabricante e modelo");
  if(g("n_ser")&&S.ativos.some(a=>a.serie.toLowerCase()===g("n_ser").toLowerCase()))return toast("Número de série já cadastrado");
  const a={cod:nextCode(g("n_cat")),cat:g("n_cat"),fab:g("n_fab"),mod:g("n_mod"),serie:g("n_ser"),fil:g("n_fil"),loc:g("n_loc"),resp:g("n_res"),st:g("n_res")?"Em uso":"Disponível",cond:"Bom",aq:"",gar:g("n_gar"),obs:""};
  S.ativos.push(a);S.movs.unshift({id:movId(),cod:a.cod,tipo:"Cadastro inicial",dt:now(),user:me,de:"—",para:`${fil(a.fil)} / ${a.loc}`,resp0:"",resp1:a.resp,motivo:"Entrada no inventário"});
  save();render();ficha(a.cod)
}
function ficha(c){
  const a=S.ativos.find(x=>x.cod===c);if(!a)return toast("Código não encontrado: "+c);history.replaceState(null,"","#"+c);
  const H=S.movs.filter(m=>m.cod===c);
  modal(`<div class="row" style="justify-content:space-between"><div><div class="mu">${CATS[a.cat]}</div><h2 style="margin:0">${a.cod}</h2></div><span class="tag t-${a.st.replace(" ","-")}">${a.st}</span></div>

  modal(`<div class="row" style="justify-content:space-between;margin-top:0"><h2 style="margin:0">${esc(r.nome)}</h2><span class="tag">${r.status||"Em uso"}</span></div>
  <div class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 16px">${rows.map(([a,b])=>`<div><span class="mu">${a}:</span> ${esc(b)||"—"}</div>`).join("")}<div><span class="mu">Senha:</span> <span id="pwp">${r.senha?"••••••":"—"}</span> ${r.senha?`<button class="btn g s" onclick="pwp('${id}')">👁</button>`:""}</div></div>
  <div class="row"><button class="btn s" onclick="edP('${id}')">✏️ Editar / config.</button><button class="btn s g" onclick="docP('${id}','resp')">Termo de responsabilidade</button><button class="btn s g" onclick="docP('${id}','desc')">Termo de desconto (sinistro)</button><button class="btn s g" onclick="docP('${id}','ambos')">Imprimir ambos</button>${r.status==="Devolvido"?"":`<button class="btn s d" onclick="confP('${id}')">Devolução / transição</button>`}</div>
  <b>Conferências de devolução / transição</b><div class="tl" style="margin-top:10px">${(r.conf||[]).map((c,i)=>`<div><b>${c.tipo}</b>${c.div?" · ⚠️ divergência":" · ✔ conforme"} <span class="mu">${c.dt} · superior: ${esc(c.sup)}</span> <button class="btn g s" onclick="docP('${id}','conf:${i}')">ver / imprimir</button></div>`).join("")||'<span class="mu">Nenhuma ainda.</span>'}</div><button class="btn g" onclick="closeM()" style="margin-top:8px">Fechar</button>`)}
function confP(id){const r=S.pessoas.find(x=>x.id===id);
  modal(`<h2 style="margin-top:0">Conferência de devolução / transição</h2><p class="mu">${esc(r.nome)} · ${esc(eq(r))}. O superior deve conferir <b>todas</b> as peças e marcar cada item. Divergência da configuração registrada exige justificativa.</p>
  <div class="f"><label>Tipo<select id="c_t" onchange="$('#c_n').style.display=this.value==='Transição'?'grid':'none'"><option>Devolução</option><option>Transição</option></select></label><label>Superior conferente (nome)<input id="c_s"></label><label>E-mail do superior<input id="c_se" type="email"></label></div>
  <div id="c_n" class="f" style="display:none;margin-top:10px"><label>Novo colaborador<input id="c_nn"></label><label>E-mail do novo colaborador<input id="c_ne" type="email"></label></div>
  <div class="card tw" style="margin-top:12px"><table><tr><th>Item</th><th>Registrado</th><th>Encontrado</th><th>Conferido</th></tr>${CHK.map(([k,l])=>`<tr><td>${l}</td><td>${esc(r[k])||"—"}</td><td><input id="c_v_${k}" value="${esc(r[k])}" style="width:150px"></td><td><input type="checkbox" id="c_k_${k}"></td></tr>`).join("")}
  <tr><td>Liga e funciona (teste feito)</td><td>—</td><td></td><td><input type="checkbox" id="c_k_fn"></td></tr><tr><td>Contas pessoais e biometria removidas</td><td>—</td><td></td><td><input type="checkbox" id="c_k_dp"></td></tr></table></div>
  <div class="f"><label>Condição física<select id="c_c"><option>Bom estado</option><option>Desgaste normal</option><option>Avariado</option></select></label><label>Divergências / observações<textarea id="c_o" rows="2"></textarea></label></div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveConf('${id}')">Registrar conferência</button><button class="btn g" onclick="fichaP('${id}')">Voltar</button></div>`)}
function saveConf(id){const r=S.pessoas.find(x=>x.id===id),v=i=>$("#"+i).value.trim(),t=v("c_t"),sup=v("c_s"),se=v("c_se");
  if(!sup||!se)return toast("Informe nome e e-mail do superior");
  if(nz(se)===nz(r.email))return toast("O conferente não pode ser o próprio colaborador");
  if(t==="Transição"&&(!v("c_nn")||!v("c_ne")))return toast("Informe o novo colaborador");
  const it=CHK.map(([k,l])=>({l,reg:r[k]||"",enc:v("c_v_"+k),ok:$("#c_k_"+k).checked}));
  if(it.some(x=>!x.ok)||!$("#c_k_fn").checked||!$("#c_k_dp").checked)return toast("Marque todos os itens como conferidos");
  const div=it.some(x=>nz(x.reg)!==nz(x.enc))||v("c_c")==="Avariado";if(div&&!v("c_o"))return toast("Há divergência: descreva nas observações");
  (r.conf=r.conf||[]).push({dt:now(),tipo:t,por:me,sup,se,it,cond:v("c_c"),obs:v("c_o"),div,de:r.nome,deEmail:r.email,para:t==="Transição"?v("c_nn"):""});
  if(t==="Devolução")r.status="Devolvido";else{r.nome=v("c_nn");r.email=v("c_ne");r.senha="";r.faceid="";r.cpf="";r.entrega="";r.status="Em uso"}
  save();render();docP(id,"conf:"+(r.conf.length-1));toast("Conferência registrada")}
const lin=(a,b)=>`<tr><td style="width:38%"><b>${a}</b></td><td>${esc(b)||"—"}</td></tr>`;
const dados=r=>`<table style="margin:8px 0">${[["Colaborador",r.nome],["CPF",r.cpf],["Cargo / setor",[r.cargo,r.setor].filter(Boolean).join(" / ")],["Filial",r.filial],["E-mail",r.email],["Celular / contato corporativo",r.tel],["Biometria (FaceID) ativada",r.faceid],["Equipamento",eq(r)],...CHK.map(([k,l])=>[l,r[k]]),["Valor estimado",r.valor?"R$ "+r.valor:""],["Data de entrega",r.entrega?new Date(r.entrega+"T12:00").toLocaleDateString("pt-BR"):""]].map(([a,b])=>lin(a,b)).join("")}</table>`;
const sig=(...n)=>`<div style="display:flex;gap:24px;margin-top:50px;flex-wrap:wrap">${n.map(x=>`<div style="flex:1;min-width:170px;text-align:center;border-top:1px solid #000;padding-top:4px">${x}</div>`).join("")}</div>`;
const dtl=r=>`<p style="margin-top:18px">${esc(r.filial)||"______________"}, ____ / ____ / ________.</p>`;
const ol=a=>a.map((t,i)=>`<p><b>${i+1}.</b> ${t}</p>`).join("");
function docResp(r){return`<h3>TERMO DE RESPONSABILIDADE PELO USO DE EQUIPAMENTO</h3><div style="text-align:center">${esc(EMPRESA)}</div>${dados(r)}
  <p>Declaro ter recebido da empresa ${esc(EMPRESA)} o equipamento acima descrito, em perfeito estado de funcionamento e com a configuração indicada, e assumo as seguintes responsabilidades:</p>
  ${ol(["O equipamento é de propriedade da empresa e me é cedido exclusivamente para a execução de minhas atividades profissionais, não integrando minha remuneração nem gerando direito de propriedade.","Comprometo-me a zelar pela guarda, conservação e uso adequado do equipamento, não o emprestar a terceiros, não abri-lo, trocar peças, alterar sua configuração nem instalar programas sem autorização da área de TI.","Minhas credenciais e senhas são pessoais e intransferíveis, e seguirei a política de segurança da informação da empresa.","Em caso de perda, furto, roubo, dano ou defeito, comunicarei imediatamente a TI e meu superior imediato; em caso de furto ou roubo, apresentarei boletim de ocorrência.","Quanto a equipamentos móveis com biometria (FaceID), ciente de que a biometria é dado pessoal que permanece apenas no aparelho, comprometo-me a removê-la na devolução, bem como a desvincular contas pessoais e bloqueios de ativação, devolvendo o aparelho livre de dados pessoais.","Na devolução ou transição (troca de responsável, desligamento ou solicitação da empresa), o equipamento será conferido integralmente pelo meu superior imediato, que verificará se peças, configuração (processador, memória, armazenamento e demais itens) e acessórios correspondem ao descrito neste termo. Divergências serão registradas.","A responsabilidade por eventuais danos observará o Termo de Autorização de Desconto, quando aplicável."])}${dtl(r)}${sig("Colaborador<br>"+esc(r.nome),"Superior imediato","Responsável pela TI")}`}
function docDesc(r){return`<h3>TERMO DE AUTORIZAÇÃO DE DESCONTO EM CASO DE SINISTRO<br>(PERDA, DEFEITO, QUEBRA OU DANO)</h3><div style="text-align:center">${esc(EMPRESA)}</div>
  <table style="margin:8px 0">${lin("Colaborador",r.nome)}${lin("CPF",r.cpf)}${lin("Equipamento",eq(r))}${lin("Nº de série",r.serie)}${lin("Valor estimado na entrega",r.valor?"R$ "+r.valor:"")}</table>
  <p>Eu, acima identificado(a), ciente de que recebi o equipamento descrito no Termo de Responsabilidade, autorizo expressamente, nos termos do art. 462, §1º, da CLT, o desconto em minha remuneração dos valores correspondentes ao prejuízo causado à empresa por perda, defeito, quebra ou dano (sinistro) do equipamento decorrente de culpa (negligência, imprudência ou imperícia) ou dolo de minha parte, desde que apurados nos termos abaixo:</p>
  ${ol(["O sinistro será registrado e apurado pela TI e pelo superior imediato, sendo-me assegurado o direito de me manifestar e de conhecer o laudo ou orçamento antes de qualquer desconto.","O valor descontado corresponderá ao custo comprovado de reparo ou, se inviável, ao valor de reposição do equipamento, considerada a depreciação, e não excederá o prejuízo efetivamente apurado.","Não haverá desconto por desgaste natural pelo uso regular, defeito de fabricação, caso fortuito ou força maior, nem por furto ou roubo ocorrido sem culpa minha, desde que comunicado imediatamente e acompanhado de boletim de ocorrência.","O desconto poderá ser parcelado de comum acordo, observados os limites legais. Em caso de rescisão, o saldo poderá ser compensado nas verbas rescisórias, observado o limite do art. 477, §5º, da CLT.","Em caso de dolo, o desconto é devido independentemente da autorização prevista no art. 462, §1º, da CLT."])}${dtl(r)}${sig("Colaborador<br>"+esc(r.nome),"Superior imediato","Responsável pela TI / RH")}`}
function docConf(r,c){return`<h3>TERMO DE CONFERÊNCIA DE ${c.tipo.toUpperCase()}</h3><div style="text-align:center">${esc(EMPRESA)}</div>
  <table style="margin:8px 0">${lin("Equipamento",eq(r))}${lin("Colaborador que entrega",c.de)}${lin("E-mail",c.deEmail)}${c.para?lin("Novo responsável",c.para):""}${lin("Data / hora",c.dt)}${lin("Conferente (superior)",c.sup+" · "+c.se)}${lin("Registrado no sistema por",c.por)}</table>
  <table><tr><th>Item</th><th>Registrado</th><th>Encontrado</th><th>Resultado</th></tr>${c.it.map(x=>`<tr><td>${x.l}</td><td>${esc(x.reg)||"—"}</td><td>${esc(x.enc)||"—"}</td><td>${nz(x.reg)===nz(x.enc)?"✔ Conforme":"⚠ Divergente"}</td></tr>`).join("")}</table>
  <p><b>Testes:</b> equipamento ligado e funcionando; contas pessoais e biometria removidas. <b>Condição física:</b> ${esc(c.cond)}.</p><p><b>Parecer:</b> ${c.div?"HÁ DIVERGÊNCIA. ":"Sem divergências. "}${esc(c.obs)}</p>${dtl(r)}${sig("Colaborador que entrega<br>"+esc(c.de),"Superior conferente<br>"+esc(c.sup),"Responsável pela TI")}`}
function docP(id,t){const r=S.pessoas.find(x=>x.id===id);let h="";
  if(t==="resp"||t==="ambos")h+=docResp(r);if(t==="ambos")h+='<div style="page-break-after:always"></div>';
  if(t==="desc"||t==="ambos")h+=docDesc(r);if(t.startsWith("conf:"))h+=docConf(r,r.conf[+t.slice(5)]);
  modal(`<div class="np row" style="margin-top:0"><button class="btn" onclick="print()">🖨️ Imprimir</button><button class="btn g" onclick="fichaP('${id}')">Voltar</button></div><p class="np mu" style="font-size:12px">Modelo de referência: valide o texto com o jurídico / DP antes de usar.</p><div class="doc">${h}</div>`)}
const rowsP=L=>[HDR,...L.map(r=>KEYS.map(k=>r[k]||(k==="status"?"Em uso":"")))];
function expP(){const ws=XLSX.utils.aoa_to_sheet(rowsP(visP()));ws["!cols"]=HDR.map(h=>({wch:Math.max(14,h.length+2)}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Colaboradores");XLSX.writeFile(wb,"colaboradores.xlsx");toast("Exportada (contém senhas: guarde com cuidado)")}
function qlpGroups(){const by={};livre().forEach(r=>{const f=r.filial||"Sem filial",s=r.setor||"Sem setor";((by[f]??={})[s]??=[]).push(r)});return by}
function qlp(){const by=qlpGroups(),fs=Object.keys(by).sort();
  return`<h2>QLP — Quadro de lotação e colaboradores</h2><div class="row"><button class="btn" onclick="expQ()">Exportar QLP (.xlsx)</button><button class="btn g" onclick="print()">Imprimir</button></div>
  <div class="doc">${fs.map(f=>{const n=Object.values(by[f]).flat().length;return`<h3 style="text-align:left;margin-top:14px">${esc(f)} — ${n} colaborador(es)</h3>${Object.keys(by[f]).sort().map(st=>`<p style="margin:8px 0 2px"><b>${esc(st)}</b> (${by[f][st].length})</p><table><tr><th>Nome</th><th>Cargo</th><th>E-mail</th><th>Contato</th><th>FaceID</th><th>Equipamento</th><th>Série</th></tr>${by[f][st].map(r=>`<tr><td>${esc(r.nome)}</td><td>${esc(r.cargo)}</td><td>${esc(r.email)}</td><td>${esc(r.tel)}</td><td>${esc(r.faceid)}</td><td>${esc(eq(r))}</td><td>${esc(r.serie)}</td></tr>`).join("")}</table>`).join("")}`}).join("")||"<p>Sem colaboradores cadastrados.</p>"}</div>`}
function expQ(){const by=qlpGroups(),R=[["FILIAL","SETOR","COLABORADORES"]];Object.keys(by).sort().forEach(f=>Object.keys(by[f]).sort().forEach(s=>R.push([f,s,by[f][s].length])));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(R),"QLP");XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rowsP(livre())),"Colaboradores");XLSX.writeFile(wb,"qlp.xlsx");toast("QLP exportado (contém senhas na aba Colaboradores)")}
function formImpP(){modal(`<h2 style="margin-top:0">Importar planilha</h2><p class="mu">Arquivo Excel (.xlsx) ou CSV. Colunas reconhecidas pelo título: Nome, CPF, Cargo, Setor, Filial, Contato, E-mail, Senha, Tipo, Modelo, Série, Processador, Memória RAM, SSD, HD, Placa de vídeo, Sistema, Tela, Acessórios, Valor, FaceID. Registros com mesmo nome e e-mail são ignorados.</p><input type="file" accept=".xlsx,.xls,.csv" onchange="impP(this.files[0])"><div class="row"><button class="btn g" onclick="closeM()">Cancelar</button></div>`)}
function impP(f){if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{const wb=XLSX.read(rd.result,{type:"array"}),A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
    const hi=A.findIndex(r=>r.some(c=>/nome/.test(nz(c))));if(hi<0)return toast("Não encontrei a coluna NOME");
    const H=A[hi].map(nz),m={};for(const k in FX)m[k]=H.findIndex(h=>FX[k].test(h));let n=0,sk=0;
    for(const r of A.slice(hi+1)){const d={};for(const k in m)d[k]=m[k]>=0?String(r[m[k]]||"").trim():"";if(!d.nome)continue;
      if(S.pessoas.some(x=>!x.removido&&nz(x.nome)===nz(d.nome)&&nz(x.email)===nz(d.email))){sk++;continue}
      S.pessoas.push({id:uid(),v:2,status:"Em uso",...d});n++}
    toast("Salvando no banco…");const ok=await save();if(ok&&sb)await load();closeM();render();
    if(ok)toast(n+" importados e salvos"+(sb?" no banco, visíveis para todos":" (só neste aparelho)")+(sk?`, ${sk} já existiam`:""))
  }catch(e){toast("Não consegui ler o arquivo")}};rd.readAsArrayBuffer(f)}
start();
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&S.ativos.some(a=>a.cod===h))ficha(h)});
</script></body></html>
