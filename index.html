<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipamentos e Contatos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#1b2333;--mu:#667085;--bd:#e3e8f0;--pr:#4f46e5;--pt:#fff;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--sf:#181f2e;--tx:#e8ecf5;--mu:#98a2b8;--bd:#2a3347;--pr:#818cf8;--pt:#10142a;--er:#f87171;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1150px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:0 0 4px}.mu{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:none;color:var(--pr);border:1px solid var(--bd)}.btn.d{background:var(--er);color:#fff}.btn.s{padding:3px 8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}
tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.f label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal>div{background:var(--sf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
@media(min-width:700px){.modal{align-items:center;padding:20px}.modal>div{border-radius:18px}}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;display:none}
</style></head><body>
<main id="m"></main><div id="toast"></div><div id="md"></div>
<script>
// ===== CONFIGURAÇÃO: cole aqui a URL e a chave anon do Supabase =====
const CFG={url:"https://sfejenutgnvdviriysjb.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmZWplbnV0Z252ZHZpcml5c2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDc2OTYsImV4cCI6MjEwODUyMzY5Nn0.-tSNotkaZJqmm050_KS_uYv5qM_k127Ptkj3duDmfz4"};
// ====================================================================
let base="";try{base=new URL(CFG.url.trim()).origin}catch(e){}
const sb=base.startsWith("https")?supabase.createClient(base,CFG.key.trim()):null;
const TB="ti_ativos";let S=[],q="",shown={},snap={},chain=Promise.resolve(),rt;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)};
const uid=()=>"P"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
async function load(){
  if(!sb){try{S=JSON.parse(localStorage.getItem("eq")||"[]")}catch(e){}return}
  const{data,error}=await sb.from(TB).select("id,data").order("updated_at");
  if(error)return toast("Erro ao carregar: "+error.message);
  const L=data.filter(r=>r.data&&r.data.v===2);S=L.map(r=>r.data);snap=Object.fromEntries(L.map(r=>[r.id,JSON.stringify(r.data)]))
}
async function _save(){
  if(!sb){try{localStorage.setItem("eq",JSON.stringify(S))}catch(e){}return}
  for(const r of S){const js=JSON.stringify(r);if(snap[r.id]===js)continue;
    const res=snap[r.id]===undefined?await sb.from(TB).insert({id:r.id,data:r}):await sb.from(TB).update({data:r,updated_at:new Date().toISOString()}).eq("id",r.id);
    if(res.error){toast("Erro ao salvar: "+res.error.message);await load();render();return}snap[r.id]=js}
}
const save=()=>chain=chain.then(_save);
const vis=()=>S.filter(r=>!r.removido&&(!q||norm([r.nome,r.tel,r.email,r.modelo,r.serie].join(" ")).includes(norm(q))));
function render(){
  const L=vis();
  $("#m").innerHTML=(sb?"":`<div class="card" style="border-color:var(--er);color:var(--er)"><b>⚠️ Modo local:</b> banco não conectado. Os dados ficam só neste aparelho. Preencha CFG no começo do script.</div>`)+
  `<h1>Equipamentos e contatos</h1><div class="mu">${S.filter(r=>!r.removido).length} registros</div>
  <div class="row"><input id="sq" placeholder="Buscar nome, e-mail, modelo, série…" value="${esc(q)}" oninput="q=this.value;keep()" style="flex:1;min-width:180px">
  <button class="btn" onclick="edit()">+ Novo</button><button class="btn g" onclick="formImp()">Importar planilha</button><button class="btn g" onclick="exportar()">Exportar planilha</button>${sb?'<button class="btn g" onclick="logout()">Sair</button>':""}</div>
  <div class="card tw"><table><tr><th>Nome</th><th>Contato corporativo</th><th>E-mail</th><th>Senha notebook</th><th>Modelo</th><th>Série</th></tr>
  ${L.map(r=>`<tr class="c" onclick="edit('${r.id}')"><td><b>${esc(r.nome)}</b></td><td>${esc(r.tel)||"—"}</td><td>${esc(r.email)||"—"}</td><td onclick="event.stopPropagation()">${shown[r.id]?esc(r.senha):r.senha?"••••••":"—"} ${r.senha?`<button class="btn g s" onclick="shown['${r.id}']=!shown['${r.id}'];keep()">👁</button>`:""}</td><td>${esc(r.modelo)||"—"}</td><td>${esc(r.serie)||"—"}</td></tr>`).join("")||'<tr><td colspan="6" class="mu">Nenhum registro. Use "+ Novo" ou "Importar planilha".</td></tr>'}</table></div>`
}
function keep(){const el=document.activeElement,id=el&&el.id,p=el&&el.selectionStart;render();if(id==="sq"){const e=$("#sq");e.focus();e.setSelectionRange(p,p)}}
const modal=h=>$("#md").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`,closeM=()=>$("#md").innerHTML="";
function edit(id){
  const r=S.find(x=>x.id===id)||{};
  modal(`<h2 style="margin-top:0">${id?"Editar":"Novo registro"}</h2><div class="f">
  <label>Nome<input id="f_n" value="${esc(r.nome)}"></label><label>Contato corporativo<input id="f_t" value="${esc(r.tel)}" placeholder="(31) 9 0000-0000"></label>
  <label>E-mail<input id="f_e" type="email" value="${esc(r.email)}"></label><label>Senha do notebook (opcional)<input id="f_s" value="${esc(r.senha)}" autocomplete="off"></label>
  <label>Modelo (opcional)<input id="f_m" value="${esc(r.modelo)}"></label><label>Nº de série (opcional)<input id="f_r" value="${esc(r.serie)}"></label></div>
  <div class="row"><button class="btn" onclick="gravar('${id||""}')">Salvar</button><button class="btn g" onclick="closeM()">Cancelar</button>${id?`<button class="btn d" onclick="remover('${id}')" style="margin-left:auto">Remover</button>`:""}</div>`)
}
function gravar(id){
  const v=i=>$("#"+i).value.trim(),nome=v("f_n");if(!nome)return toast("Informe o nome");
  const d={nome,tel:v("f_t"),email:v("f_e"),senha:v("f_s"),modelo:v("f_m"),serie:v("f_r")};
  if(d.serie&&S.some(x=>x.id!==id&&!x.removido&&norm(x.serie)===norm(d.serie)))return toast("Número de série já cadastrado");
  const r=S.find(x=>x.id===id);if(r)Object.assign(r,d);else S.push({id:uid(),v:2,...d});
  save();closeM();render();toast("Salvo")
}
function remover(id){if(!confirm("Remover este registro?"))return;S.find(x=>x.id===id).removido=true;save();closeM();render()}
function exportar(){
  const A=[["NOME","CONTATO CORPORATIVO","E-MAIL","SENHA NOTEBOOK","MODELO","SÉRIE"],...vis().map(r=>[r.nome,r.tel,r.email,r.senha,r.modelo,r.serie])];
  const ws=XLSX.utils.aoa_to_sheet(A);ws["!cols"]=[{wch:38},{wch:20},{wch:40},{wch:20},{wch:22},{wch:22}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Equipamentos");XLSX.writeFile(wb,"equipamentos.xlsx");toast("Planilha exportada (contém senhas: guarde com cuidado)")
}
function formImp(){modal(`<h2 style="margin-top:0">Importar planilha</h2><p class="mu">Escolha um arquivo Excel (.xlsx) ou CSV. As colunas são reconhecidas pelo título: Nome, Contato, E-mail, Senha, Modelo, Série. Registros já existentes (mesmo nome e e-mail) são ignorados.</p><input type="file" accept=".xlsx,.xls,.csv" onchange="imp(this.files[0])"><div class="row"><button class="btn g" onclick="closeM()">Cancelar</button></div>`)}
function imp(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{
    const wb=XLSX.read(rd.result,{type:"array"}),A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
    const hi=A.findIndex(r=>r.some(c=>/nome/.test(norm(c))));if(hi<0)return toast("Não encontrei a coluna NOME");
    const H=A[hi].map(norm),ix=re=>H.findIndex(h=>re.test(h)),m={n:ix(/nome/),t:ix(/contato|telefone|fone|cel/),e:ix(/mail/),s:ix(/senha/),m:ix(/modelo/),r:ix(/serie|serial/)};
    const g=(r,k)=>m[k]>=0?String(r[m[k]]||"").trim():"";let n=0,sk=0;
    for(const r of A.slice(hi+1)){const nome=g(r,"n");if(!nome)continue;const email=g(r,"e");
      if(S.some(x=>!x.removido&&norm(x.nome)===norm(nome)&&norm(x.email)===norm(email))){sk++;continue}
      S.push({id:uid(),v:2,nome,tel:g(r,"t"),email,senha:g(r,"s"),modelo:g(r,"m"),serie:g(r,"r")});n++}
    save();closeM();render();toast(n+" importados"+(sk?`, ${sk} já existiam`:""))
  }catch(e){toast("Não consegui ler o arquivo")}};
  rd.readAsArrayBuffer(f)
}
function loginView(){$("#m").innerHTML=`<div class="card" style="max-width:380px;margin:12vh auto"><h1>🗂️ Equipamentos e contatos</h1><div class="f" style="grid-template-columns:1fr;margin-top:14px"><label>E-mail<input id="le" type="email"></label><label>Senha<input id="lp" type="password" onkeydown="if(event.key==='Enter')login()"></label></div><div class="row"><button class="btn" onclick="login()">Entrar</button></div></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value});if(error)return toast("Erro: "+error.message);start()}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){
  if(sb){const{data}=await sb.auth.getSession();if(!data.session)return loginView()}
  await load();render();
  if(sb)sb.channel("eq").on("postgres_changes",{event:"*",schema:"public",table:TB},()=>{clearTimeout(rt);rt=setTimeout(async()=>{await chain;await load();if(!$("#md").innerHTML&&!document.activeElement.matches("input"))render()},700)}).subscribe()
}
start();
</script></body></html>
